name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions, docs links, manifest, no background components
        run: scripts/check-repo.sh

  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Release build (R8 and resource shrinking)
        run: ./gradlew assembleRelease
      - name: APK size and contents
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          size=$(stat -c %s "$apk")
          echo "APK size: $size bytes"
          [ "$size" -lt 400000 ] || { echo "APK grew past 400 KB"; exit 1; }
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump permissions "$apk" | tee permissions.txt
          # TinyKit asks for no dangerous permission and has no notification permission.
          ! grep -q "POST_NOTIFICATIONS" permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tinykit-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore

  emulator:
    name: Emulator, Android ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 28, 30, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tinykit-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: scripts/ci-smoke.sh apk/app-release.apk
